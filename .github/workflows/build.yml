‎name: Build BDFireZone APK
‎
‎on:
‎  workflow_dispatch:
‎  push:
‎    branches: ["main"]
‎
‎permissions:
‎  contents: write
‎
‎jobs:
‎  build:
‎    runs-on: ubuntu-latest
‎
‎    steps:
‎name: Checkout
‎        uses: actions/checkout@v4
‎
‎name: Set up JDK 17
‎        uses: actions/setup-java@v4
‎        with:
‎          distribution: temurin
‎          java-version: "17"
‎
‎name: Set up Gradle
‎        uses: gradle/actions/setup-gradle@v4
‎        with:
‎          gradle-version: "8.9"
‎
‎name: Build APK
‎        run: gradle assembleDebug --stacktrace
‎
‎name: Upload APK
‎        uses: softprops/action-gh-release@v2
‎        with:
‎          tag_name: "latest"
‎          name: "BDFireZone APK"
‎          make_latest: true
‎          files: app/build/outputs/apk/debug/BDFireZone.apk
‎
